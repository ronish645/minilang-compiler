[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minilang"
version = "1.0.0"
description = "A compiler for MiniLang written from scratch in Python, plus an LLM code-generation benchmark"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ronish Shrestha" }]
license = { text = "MIT" }
# The compiler itself has zero runtime dependencies.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
bench = ["anthropic>=0.40", "openai>=1.50", "pyyaml>=6", "python-dotenv>=1"]
mcp = ["mcp>=1.2"]

[project.scripts]
minilang = "minilang.cli:main"
minilang-mcp = "minilang.mcp_server:main"

[tool.setuptools.packages.find]
include = ["minilang*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["minilang", "bench"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
