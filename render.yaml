# Render Blueprint: Render → New → Blueprint → pick this repo.
services:
  - type: web
    name: minilang-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    branch: main
    autoDeploy: true # redeploy on every push to main
    envVars:
      - key: MINILANG_RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: MINILANG_MAX_SOURCE_CHARS
        value: "20000"
      # Who is the client? Measured on the live service (2026-10-15): Render keeps any
      # X-Forwarded-For the client sends (so the leftmost entry can be forged), and the
      # rightmost entry is a proxy address that changes between requests. Cloudflare,
      # in front of Render, overwrites CF-Connecting-IP with the real client address,
      # so trust that header and nothing in X-Forwarded-For. If the header is missing,
      # hops 0 falls back to the socket peer (all such requests share one bucket: safe).
      - key: MINILANG_CLIENT_IP_HEADER
        value: CF-Connecting-IP
      - key: MINILANG_TRUSTED_PROXY_HOPS
        value: "0"
      - key: MINILANG_MAX_CONCURRENT_PROGRAMS
        value: "4"
