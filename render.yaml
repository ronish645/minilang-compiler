# Render Blueprint: Render → New → Blueprint → pick this repo.
services:
  - type: web
    name: minilang-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    branch: main
    autoDeploy: true # redeploy on every push to main
    envVars:
      - key: MINILANG_RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: MINILANG_MAX_SOURCE_CHARS
        value: "20000"
      # Render's load balancer appends the address it received the request from to
      # X-Forwarded-For, so the client is the 1st entry from the right; anything to its
      # left was written by the client and is ignored. Confirm this against Render's
      # docs (and the logged "client" field) after deploying; 0 would use the proxy's IP.
      - key: MINILANG_TRUSTED_PROXY_HOPS
        value: "1"
      - key: MINILANG_MAX_CONCURRENT_PROGRAMS
        value: "4"
